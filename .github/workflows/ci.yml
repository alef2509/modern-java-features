name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Compile JMH benchmarks
        run: ./mvnw -B -P benchmarks package -DskipTests

      - name: Run compact source file scripts
        run: |
          java scripts/Hello.java
          java scripts/TopWords.java README.md 5
